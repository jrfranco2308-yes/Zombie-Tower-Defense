<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dead Lane: Endless</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ember:#ff7a1a;--ink:#14120e;--panel:#231f17;--panel2:#2e281d;--text:#efe6d0;--line:#4b4232;--acid:#9bd45a}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:'Silkscreen',ui-monospace,Menlo,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
#app{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;background:var(--ink)}
#hud{display:flex;gap:6px;padding:8px 8px 6px}
.chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 4px;font-size:9px;text-align:center;opacity:.9}
.chip b{display:block;font-size:15px;color:var(--ember);margin-top:2px}
.chip.g b{color:#ffd27a}.chip.l b{color:#e5604f}.chip.bst b{color:var(--acid)}
#stage{flex:1 1 0;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
#bottom{height:142px;padding:8px;box-sizing:border-box;background:linear-gradient(#1b1812,#14120e);border-top:2px solid var(--line)}
#tray,#panel{height:100%;display:flex;gap:6px}
#panel{display:none;flex-direction:column;gap:6px}
.b{flex:1;position:relative;background:var(--panel);border:2px solid var(--line);border-radius:5px;font-size:10px;line-height:1.35;padding:4px 2px}
.b small{display:block;font-size:9px;opacity:.7}
.b.sel{border-color:var(--ember);background:var(--panel2)}
.b.no{opacity:.4}
.tb i{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:5px;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.3)}
.tb:nth-child(2) i{border-radius:50%}.tb:nth-child(3) i{transform:rotate(45deg) scale(.8)}.tb:nth-child(4) i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
#send{flex:1.1;background:var(--ember);border-color:var(--ember);color:#1a0f05;font-weight:700;font-size:12px}
#send.no{opacity:.4}
.ph{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.ph span{opacity:.7;font-size:9px;margin-left:6px}
.x{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:10px}
.row{display:flex;gap:6px;flex:1}
.u{border-color:#4f6a33;color:var(--text)}
.u i{display:block;font-style:normal;color:var(--acid);font-size:9px;letter-spacing:1px}
.sell{flex:.9;border-color:#8a3b2d}
.sw{flex:.65}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(20,18,14,.92);gap:12px;padding:24px;line-height:1.5}
#msg h1{font-size:30px;margin:0;color:var(--ember)}
#msg p{margin:0;max-width:300px;font-size:13px;opacity:.85}
#msg .bs{color:var(--acid);font-size:15px}
#go{background:var(--ember);color:#1a0f05;border:0;font-weight:700;font-size:16px;padding:14px 28px;border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip">WAVE<b id="w">0</b></div>
    <div class="chip bst">BEST<b id="best">0</b></div>
    <div class="chip g">GOLD<b id="g">0</b></div>
    <div class="chip l">LIVES<b id="l">0</b></div>
  </div>
  <div id="stage"><canvas id="c"></canvas>
    <div id="msg"><h1>DEAD LANE</h1><p id="mp">Endless waves. Tap open ground to build, tap a tower to upgrade, sell or swap it.</p><div class="bs" id="mb"></div><button id="go">START</button></div>
  </div>
  <div id="bottom">
    <div id="tray"></div>
    <div id="panel"></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const C=40,COLS=9,ROWS=13,W=C*COLS,H=C*ROWS;
let sc=1,ox=0,oy=0;
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);sc=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2}
addEventListener('resize',fit);fit();if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));setTimeout(fit,300);
// best score
let best=0;try{best=+localStorage.getItem('deadlane_best')||0}catch(e){}
function saveBest(){try{localStorage.setItem('deadlane_best',best)}catch(e){}}
// path + decor
const wpc=[[1,-1],[1,3],[7,3],[7,6],[1,6],[1,9],[7,9],[7,13]];
const wp=wpc.map(p=>[p[0]*C+C/2,p[1]*C+C/2]);
const seg=[];let total=0;
for(let i=1;i<wp.length;i++){const l=Math.hypot(wp[i][0]-wp[i-1][0],wp[i][1]-wp[i-1][1]);seg.push(l);total+=l}
function posAt(d){for(let i=0;i<seg.length;i++){if(d<=seg[i]){const t=d/seg[i];return[wp[i][0]+(wp[i+1][0]-wp[i][0])*t,wp[i][1]+(wp[i+1][1]-wp[i][1])*t]}d-=seg[i]}return wp[wp.length-1]}
const road=new Set();
for(let i=1;i<wpc.length;i++){let[a,b]=wpc[i-1],[c,d]=wpc[i];const sx=Math.sign(c-a),sy=Math.sign(d-b);while(a!==c||b!==d){road.add(a+','+b);if(a!==c)a+=sx;else b+=sy}road.add(c+','+d)}
const isRoad=(c,r)=>road.has(c+','+r);
const hs=(c,r)=>(c*73+r*131)%11;
const blocked=(c,r)=>!isRoad(c,r)&&hs(c,r)<2;
// towers
const T=[
 {n:'GUNNER',s:'rapid fire',cost:50,range:85,dmg:5,rate:.35,col:'#8fb15f'},
 {n:'CANNON',s:'splash damage',cost:100,range:100,dmg:14,rate:1.4,col:'#d08a40',splash:34},
 {n:'SNIPER',s:'long range',cost:140,range:185,dmg:45,rate:2.1,col:'#7fa0c8'},
 {n:'FROST',s:'slows zombies',cost:90,range:80,dmg:3,rate:.6,col:'#7fd6e0',frost:1}];
const UP=['DAMAGE','RANGE','SPEED'],MAXU=5;
const stat=t=>({dmg:T[t.k].dmg*(1+.35*t.u[0]),range:T[t.k].range+9*t.u[1],rate:T[t.k].rate*Math.pow(.88,t.u[2])});
const upCost=(t,i)=>Math.round(T[t.k].cost*.5*(1+t.u[i]));
const sellVal=t=>Math.round(t.inv*.7);
let sel=0,pick=null,Z,TW,FX,gold,lives,wave,queue,spT,boss,state='menu',toast='',toastT=0,last=0,waveOn=false,flash=0;
// UI
const tray=$('tray'),panel=$('panel');
tray.innerHTML=T.map((t,i)=>'<button class="b tb'+(i?'':' sel')+'" data-k="'+i+'" style="--c:'+t.col+'"><i></i>'+t.n+'<small>$'+t.cost+'</small></button>').join('')+'<button class="b" id="send">SEND<small>next wave</small></button>';
const tbs=[...tray.querySelectorAll('.tb')];
tray.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='send'){sendWave();return}sel=+b.dataset.k;tbs.forEach(x=>x.classList.toggle('sel',x===b))});
function say(s){toast=s;toastT=1.6}
function hud(){$('w').textContent=wave;$('best').textContent=best;$('g').textContent=gold|0;$('l').textContent=lives;
 tbs.forEach((b,i)=>b.classList.toggle('no',gold<T[i].cost));$('send').classList.toggle('no',waveOn||state!=='play');if(pick)renderPanel()}
function renderPanel(){
 if(!pick){panel.style.display='none';tray.style.display='flex';return}
 const t=pick,d=T[t.k],lv=t.u[0]+t.u[1]+t.u[2]+1;
 let h='<div class="ph"><div><b style="color:'+d.col+'">'+d.n+'</b> LV '+lv+'<span>'+d.s+'</span></div><button class="x" data-a="close">CLOSE</button></div><div class="row">';
 for(let i=0;i<3;i++){const m=t.u[i]>=MAXU,c=upCost(t,i);h+='<button class="b u'+(!m&&gold<c?' no':'')+'" data-a="u'+i+'">'+UP[i]+'<i>'+'●'.repeat(t.u[i])+'○'.repeat(MAXU-t.u[i])+'</i><small>'+(m?'MAX':'$'+c)+'</small></button>'}
 h+='</div><div class="row"><button class="b sell" data-a="sell">SELL<small>+$'+sellVal(t)+'</small></button>';
 for(let k=0;k<4;k++){if(k===t.k)continue;const n=d.cost*0+T[k].cost-sellVal(t);h+='<button class="b sw'+(gold<n?' no':'')+'" data-a="r'+k+'" style="border-color:'+T[k].col+'">'+T[k].n.slice(0,3)+'<small>'+(n>0?'$'+n:'+$'+(-n))+'</small></button>'}
 panel.innerHTML=h+'</div>';tray.style.display='none';panel.style.display='flex'}
panel.addEventListener('pointerdown',e=>{
 const b=e.target.closest('button');if(!b||!pick)return;const a=b.dataset.a,t=pick;
 if(a==='close'){pick=null}
 else if(a[0]==='u'){const i=+a[1],c=upCost(t,i);if(t.u[i]>=MAXU)say('MAX LEVEL');else if(gold<c)say('NEED $'+c);else{gold-=c;t.inv+=c;t.u[i]++;say(UP[i]+' UP')}}
 else if(a==='sell'){gold+=sellVal(t);TW=TW.filter(x=>x!==t);pick=null;say('SOLD +$'+sellVal(t))}
 else if(a[0]==='r'){const k=+a[1],n=T[k].cost-sellVal(t);if(gold<n)say('NEED $'+n);else{gold-=n;t.k=k;t.u=[0,0,0];t.inv=T[k].cost;say('SWAPPED')}}
 hud();renderPanel()});
function reset(){Z=[];TW=[];FX=[];gold=150;lives=20;wave=0;queue=0;boss=0;waveOn=false;pick=null;renderPanel();hud()}
function sendWave(){if(state!=='play'||waveOn)return;wave++;queue=Math.min(70,8+wave*3);boss=wave%10===0?1:0;spT=0;waveOn=true;if(wave>best){best=wave;saveBest()}hud()}
function spawn(){
 const m=1+.22*wave+.012*wave*wave,r=Math.random();let t;
 if(boss){boss=0;t={hp:500*m,sp:16,r:10,g:120,col:'#5a2a4a',ll:5}}
 else if(wave>=3&&r<Math.min(.3,.05*wave))t={hp:70*m/2.2,sp:20,r:7,g:20,col:'#6a2a22',ll:2};
 else if(wave>=2&&r<Math.min(.5,.1*wave))t={hp:7*m,sp:Math.min(75,56+wave*.5),r:4,g:6,col:'#8a7a3a',ll:1};
 else t={hp:14*m,sp:Math.min(45,30+wave*.5),r:5,g:5,col:'#4f6b3f',ll:1};
 t.g=Math.round(t.g*(1+wave*.04));t.max=t.hp;t.d=0;t.x=wp[0][0];t.y=wp[0][1];t.slowT=0;t.sm=1;Z.push(t)}
cv.addEventListener('pointerdown',e=>{
 if(state!=='play')return;
 const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
 const x=((e.clientX-r.left)*d-ox)/sc,y=((e.clientY-r.top)*d-oy)/sc;
 const c=Math.floor(x/C),rw=Math.floor(y/C);
 if(c<0||c>=COLS||rw<0||rw>=ROWS){pick=null;hud();renderPanel();return}
 const ex=TW.find(t=>t.c===c&&t.r===rw);
 if(ex){pick=ex;hud();renderPanel();return}
 if(isRoad(c,rw)||blocked(c,rw)){pick=null;hud();renderPanel();return}
 pick=null;
 if(gold<T[sel].cost){say('NEED $'+T[sel].cost);renderPanel();return}
 gold-=T[sel].cost;TW.push({c,r:rw,x:c*C+C/2,y:rw*C+C/2,k:sel,u:[0,0,0],inv:T[sel].cost,cd:.3,a:0});hud();renderPanel()});
function update(dt){
 if(state!=='play')return;
 if(queue>0||boss){spT-=dt;if(spT<=0){if(boss)spawn();else{spawn();queue--}spT=Math.max(.3,.95-wave*.03)}}
 for(const z of Z){z.slowT-=dt;z.d+=z.sp*(z.slowT>0?z.sm:1)*dt;const p=posAt(Math.min(z.d,total));z.x=p[0];z.y=p[1];
  if(z.d>=total){z.dead=1;lives-=z.ll;flash=.5;hud()}}
 for(const t of TW){
  const s=stat(t),d=T[t.k];t.cd-=dt;let b=null;
  for(const z of Z){if(z.dead)continue;if(Math.hypot(z.x-t.x,z.y-t.y)<=s.range&&(!b||z.d>b.d))b=z}
  if(b){t.a=Math.atan2(b.y-t.y,b.x-t.x);
   if(t.cd<=0){t.cd=s.rate;
    if(d.frost){FX.push({x:b.x,y:b.y,r:32,l:.35,m:.35,t:'f'});for(const z of Z)if(Math.hypot(z.x-b.x,z.y-b.y)<32){z.hp-=s.dmg;z.slowT=1.6;z.sm=Math.max(.3,.55-.05*t.u[0])}}
    else{FX.push({x:t.x,y:t.y,x2:b.x,y2:b.y,l:.08,m:.08,t:'l',w:t.k===2?2.5:1.2});
     if(d.splash){FX.push({x:b.x,y:b.y,r:d.splash,l:.3,m:.3,t:'b'});for(const z of Z)if(Math.hypot(z.x-b.x,z.y-b.y)<d.splash)z.hp-=s.dmg}
     else b.hp-=s.dmg}}}}
 for(const z of Z)if(z.hp<=0&&!z.dead){z.dead=1;gold+=z.g;FX.push({x:z.x,y:z.y,l:.3,m:.3,t:'d'});hud()}
 Z=Z.filter(z=>!z.dead);
 for(const f of FX)f.l-=dt;FX=FX.filter(f=>f.l>0);toastT-=dt;flash=Math.max(0,flash-dt);
 if(lives<=0){state='over';const nb=wave>=best&&wave>0;pick=null;renderPanel();msg('OVERRUN','You reached wave '+wave+'.',(nb?'NEW BEST: ':'BEST: ')+best,'TRY AGAIN');hud()}
 else if(waveOn&&queue===0&&!boss&&Z.length===0){waveOn=false;const g=25+wave*5;gold+=g;say('WAVE '+wave+' CLEAR +$'+g);hud()}
}
function msg(h,p,b,g){const m=$('msg');m.querySelector('h1').textContent=h;$('mp').textContent=p;$('mb').textContent=b;$('go').textContent=g;m.style.display='flex'}
$('mb').textContent='BEST: '+best;
$('go').addEventListener('click',()=>{$('msg').style.display='none';state='play';reset()});
function tower(t,sc2){
 const d=T[t.k],x=t.x,y=t.y;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x-14,y-11,29,29);
 ctx.fillStyle='#1b1710';ctx.fillRect(x-14,y-14,28,28);
 ctx.strokeStyle=d.col;ctx.lineWidth=1;ctx.strokeRect(x-13.5,y-13.5,27,27);
 ctx.fillStyle=d.col;
 if(t.k===0){ctx.fillRect(x-9,y-9,18,18)}
 else if(t.k===1){ctx.beginPath();ctx.arc(x,y,10,0,6.28);ctx.fill()}
 else if(t.k===2){ctx.beginPath();ctx.moveTo(x,y-11);ctx.lineTo(x+11,y);ctx.lineTo(x,y+11);ctx.lineTo(x-11,y);ctx.fill()}
 else{ctx.beginPath();ctx.moveTo(x,y-11);ctx.lineTo(x+8,y);ctx.lineTo(x,y+11);ctx.lineTo(x-8,y);ctx.fill();ctx.fillStyle='#e8fbff';ctx.fillRect(x-2,y-3,4,6)}
 if(t.k!==3){ctx.save();ctx.translate(x,y);ctx.rotate(t.a);ctx.fillStyle='#14110c';
  if(t.k===0){ctx.fillRect(2,-5,12,3);ctx.fillRect(2,2,12,3)}
  else if(t.k===1){ctx.fillRect(0,-4,13,8)}
  else ctx.fillRect(0,-2,20,4);ctx.restore()}
 const n=t.u[0]+t.u[1]+t.u[2];ctx.fillStyle='#ffd27a';for(let i=0;i<Math.min(n,10);i++)ctx.fillRect(x-12+i*2.6,y+11,2,3)}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#14120e';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(sc,0,0,sc,ox,oy);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 ctx.fillStyle='#3b3f2c';ctx.fillRect(0,0,W,H);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const X=c*C,Y=r*C,h=hs(c,r);
  if(isRoad(c,r)){ctx.fillStyle='#8a7650';ctx.fillRect(X,Y,C,C);ctx.fillStyle='#775f3a';ctx.fillRect(X+7,Y+9,5,2);ctx.fillRect(X+25,Y+27,6,2);
   ctx.fillStyle='#5a4a2c';if(!isRoad(c-1,r))ctx.fillRect(X,Y,3,C);if(!isRoad(c+1,r))ctx.fillRect(X+C-3,Y,3,C);if(!isRoad(c,r-1))ctx.fillRect(X,Y,C,3);if(!isRoad(c,r+1))ctx.fillRect(X,Y+C-3,C,3)}
  else{if((c+r)%2){ctx.fillStyle='#43472f';ctx.fillRect(X,Y,C,C)}
   ctx.fillStyle='#566038';if(h>3&&h<7){ctx.fillRect(X+8,Y+26,2,5);ctx.fillRect(X+12,Y+28,2,4);ctx.fillRect(X+27,Y+10,2,5)}
   if(h===0){ctx.fillStyle='#2a1f14';ctx.fillRect(X+18,Y+22,4,10);ctx.fillStyle='#24421f';ctx.beginPath();ctx.arc(X+20,Y+17,13,0,6.28);ctx.fill();ctx.fillStyle='#33592b';ctx.beginPath();ctx.arc(X+16,Y+14,8,0,6.28);ctx.fill()}
   if(h===1){ctx.fillStyle='#2a2a26';ctx.fillRect(X+6,Y+13,28,19);ctx.fillStyle='#5b5a52';ctx.fillRect(X+8,Y+10,22,19);ctx.fillStyle='#7a786d';ctx.fillRect(X+10,Y+12,10,6)}}}
 ctx.fillStyle='#d7c8a4';ctx.fillRect(7*C+3,H-9,C-6,9);ctx.fillStyle='#8a3b2d';ctx.fillRect(7*C+3,H-5,C-6,3);
 if(state==='play'){
  if(pick){ctx.fillStyle='rgba(255,122,26,.12)';ctx.strokeStyle='rgba(255,122,26,.85)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(pick.x,pick.y,stat(pick).range,0,6.28);ctx.fill();ctx.stroke();ctx.strokeStyle='#ff7a1a';ctx.strokeRect(pick.x-16,pick.y-16,32,32)}
  for(const t of TW)tower(t)}
 for(const z of Z){
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(z.x-z.r+1.5,z.y-z.r+2,z.r*2,z.r*2);
  ctx.fillStyle=z.slowT>0?'#6aa6b0':z.col;ctx.fillRect(z.x-z.r,z.y-z.r,z.r*2,z.r*2);
  ctx.fillStyle='#e8d6a0';ctx.fillRect(z.x-z.r+1,z.y-z.r+1,2,2);ctx.fillRect(z.x+z.r-3,z.y-z.r+1,2,2);
  if(z.hp<z.max){const w=z.r*2+6;ctx.fillStyle='#000';ctx.fillRect(z.x-w/2,z.y-z.r-6,w,3);ctx.fillStyle='#e5483a';ctx.fillRect(z.x-w/2,z.y-z.r-6,w*z.hp/z.max,3)}}
 for(const f of FX){
  if(f.t==='l'){ctx.strokeStyle='#ffd27a';ctx.lineWidth=f.w;ctx.globalAlpha=f.l/f.m;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.globalAlpha=1}
  else if(f.t==='b'){const k=1-f.l/f.m;ctx.fillStyle='rgba(255,'+(170-k*90|0)+',40,'+(.8*(1-k))+')';ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.5+k*.5),0,6.28);ctx.fill()}
  else if(f.t==='f'){const k=1-f.l/f.m;ctx.strokeStyle='rgba(150,230,240,'+(1-k)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.4+k*.6),0,6.28);ctx.stroke()}
  else{ctx.fillStyle='rgba(160,40,30,'+f.l/f.m+')';ctx.fillRect(f.x-6,f.y-6,12,12)}}
 if(flash>0){ctx.fillStyle='rgba(229,72,58,'+flash*.5+')';ctx.fillRect(0,0,W,H)}
 ctx.textAlign='center';
 if(toastT>0){ctx.globalAlpha=Math.min(1,toastT);ctx.fillStyle='#14120e';ctx.fillRect(W/2-110,H-30,220,22);ctx.fillStyle='#ff7a1a';ctx.font="700 11px Silkscreen,monospace";ctx.fillText(toast,W/2,H-15);ctx.globalAlpha=1}
}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
